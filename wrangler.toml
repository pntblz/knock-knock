name = "knock-knock"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# ปลุกทุกนาทีเพื่อดูว่ามีแจ้งเตือนไหนถึงเวลา (ฟรีในแพลน Workers Free)
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "knock-knock"
# ใส่ค่าที่ได้จาก `npx wrangler d1 create knock-knock`
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "migrations"

# ค่าลับตั้งด้วย `npx wrangler secret put <ชื่อ>` (ห้ามใส่ในไฟล์นี้)
#   DISCORD_TOKEN          bot token
#   DISCORD_PUBLIC_KEY     public key ของ application
#   DISCORD_APPLICATION_ID application id
#   OWNER_IDS              user id ของเจ้าของบอท คั่นด้วยจุลภาค
