name = "knock-knock"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# ปลุกทุกนาทีเพื่อดูว่ามีแจ้งเตือนไหนถึงเวลา (ฟรีในแพลน Workers Free)
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "knock-knock"
database_id = "a88a3c95-bb06-4732-bd77-7809bd28bc80"
migrations_dir = "migrations"

# ค่าที่เปิดเผยได้ (ดูได้ในหน้า General Information ของ Discord)
[vars]
DISCORD_APPLICATION_ID = "1572551248757006497"
DISCORD_PUBLIC_KEY = "aaa55f28882af6ed39cb92cd355344810744fb9f14172285d449d266111f8eb5"
# เซิร์ฟที่ใช้บอทได้ (คั่นด้วยจุลภาค) · เซิร์ฟอื่นสั่งคำสั่งแล้วบอทจะออกเอง · ว่าง = ทุกเซิร์ฟ
ALLOWED_GUILD_IDS = "1138170917839720508"

# ค่าลับตั้งด้วย `npx wrangler secret put <ชื่อ>` (ห้ามใส่ในไฟล์นี้)
#   DISCORD_TOKEN          bot token
#   OWNER_IDS              user id ของเจ้าของบอท คั่นด้วยจุลภาค

# ไฟล์ในโฟลเดอร์ public/ เสิร์ฟตรงที่ https://knock-knock.<ชื่อ>.workers.dev/<ไฟล์>
# (ใช้เป็นลิงก์รูปแบนเนอร์บนการ์ด) — POST จาก Discord ยังเข้า Worker ตามปกติ
[assets]
directory = "./public"
